<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — ATSS</title>
    <script>
        (function() {
            var t = localStorage.getItem('atss-theme') || 'dark';
            if (t === 'dark') document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="min-h-screen bg-stone-100 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 font-mono flex items-center justify-center px-4 transition-colors">
    <div class="w-full max-w-sm">

        <div class="mb-6">
            <p class="text-xs tracking-widest text-stone-400 dark:text-zinc-500 uppercase mb-1">ATSS</p>
            <h1 class="text-2xl font-bold text-zinc-900 dark:text-white tracking-tight">Forgot password</h1>
            <p class="text-sm text-stone-400 dark:text-zinc-500 mt-1">We'll send a reset code to your email.</p>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %}
                    <div class="mb-4 bg-red-50 dark:bg-zinc-900 border-l-4 border-red-500 px-4 py-3 text-sm text-red-600 dark:text-red-400">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="bg-white dark:bg-zinc-900 border border-stone-200 dark:border-zinc-800 p-8 space-y-4">
            <form method="POST" action="/forgot-password" class="space-y-4">
                <div class="space-y-1">
                    <label for="email" class="block text-xs font-semibold text-stone-400 dark:text-zinc-500 uppercase tracking-wider">Email Address</label>
                    <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com"
                        class="w-full bg-stone-50 dark:bg-zinc-800 border border-stone-200 dark:border-zinc-700 text-zinc-900 dark:text-white text-sm px-3 py-2.5 focus:outline-none placeholder-stone-300 dark:placeholder-zinc-600 transition-colors atss-inp">
                </div>
                <button type="submit"
                    class="w-full font-bold text-sm py-2.5 transition-colors mt-2" style="background:#FF9000;color:#18181b" onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">
                    Send Reset Code
                </button>
            </form>
        </div>

        <p class="text-xs text-stone-400 dark:text-zinc-600 mt-4 text-center">
            Remembered it?
            <a href="{{ url_for('auth.login') }}" class="text-zinc-600 dark:text-zinc-400 transition-colors" onmouseover="this.style.color='#FF9000'" onmouseout="this.style.color=''">Back to sign in</a>
        </p>
    </div>
    <script src="{{ url_for('static', filename='cursor.js') }}"></script>
</body>
</html>
