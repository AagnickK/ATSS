{% extends "base.html" %}
{% block title %}Page Not Found — ATSS{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto py-16">
    <div class="border-b border-stone-200 dark:border-zinc-800 pb-4">
        <p class="text-xs font-semibold text-stone-400 dark:text-zinc-500 uppercase tracking-wider">Error 404</p>
        <h1 class="text-xl font-bold text-zinc-900 dark:text-white tracking-tight mt-2">Page not found</h1>
        <p class="text-sm text-stone-400 dark:text-zinc-500 mt-1">The page you requested doesn't exist or may have moved.</p>
    </div>
    <div class="mt-6">
        {% if current_user.is_authenticated %}
        <a data-app-nav href="{{ url_for('main.dashboard') }}" class="inline-block bg-stone-100 dark:bg-zinc-800 hover:bg-stone-200 dark:hover:bg-zinc-700 border border-stone-200 dark:border-zinc-700 text-zinc-700 dark:text-zinc-300 text-sm px-4 py-2 transition-colors">Back to Dashboard</a>
        {% else %}
        <a href="{{ url_for('auth.login') }}" class="inline-block bg-stone-100 dark:bg-zinc-800 hover:bg-stone-200 dark:hover:bg-zinc-700 border border-stone-200 dark:border-zinc-700 text-zinc-700 dark:text-zinc-300 text-sm px-4 py-2 transition-colors">Back to Sign In</a>
        {% endif %}
    </div>
</div>
{% endblock %}
