<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — ATSS</title>
    <script>
        (function() {
            var t = localStorage.getItem('atss-theme') || 'dark';
            if (t === 'dark') document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="min-h-screen bg-stone-100 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 font-mono flex items-center justify-center px-4 transition-colors">
    <div class="w-full max-w-sm">

        <div class="mb-6">
            <p class="text-xs tracking-widest text-stone-400 dark:text-zinc-500 uppercase mb-1">ATSS</p>
            <h1 class="text-2xl font-bold text-zinc-900 dark:text-white tracking-tight">New password</h1>
            <p class="text-sm text-stone-400 dark:text-zinc-500 mt-1">Choose a strong password for your account.</p>
        </div>

        {% if error %}
            <div class="mb-4 bg-red-50 dark:bg-zinc-900 border-l-4 border-red-500 px-4 py-3 text-sm text-red-600 dark:text-red-400">{{ error }}</div>
        {% endif %}

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %}
                    <div class="mb-4 bg-emerald-50 dark:bg-zinc-900 border-l-4 border-emerald-500 px-4 py-3 text-sm text-emerald-700 dark:text-emerald-400">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="bg-white dark:bg-zinc-900 border border-stone-200 dark:border-zinc-800 p-8 space-y-4">
            <form method="POST" action="/reset-password" class="space-y-4">
                <div class="space-y-1">
                    <label for="password" class="block text-xs font-semibold text-stone-400 dark:text-zinc-500 uppercase tracking-wider">New Password</label>
                    <div class="relative">
                        <input type="password" id="password" name="password" autocomplete="new-password" required placeholder="min. 8 characters"
                            class="w-full bg-stone-50 dark:bg-zinc-800 border border-stone-200 dark:border-zinc-700 text-zinc-900 dark:text-white text-sm px-3 py-2.5 pr-10 focus:outline-none placeholder-stone-300 dark:placeholder-zinc-600 transition-colors atss-inp">
                        <button type="button" onclick="toggleVisibility('password', this)"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-stone-400 dark:text-zinc-500 hover:text-zinc-700 dark:hover:text-zinc-300 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="space-y-1">
                    <label for="confirm_password" class="block text-xs font-semibold text-stone-400 dark:text-zinc-500 uppercase tracking-wider">Confirm Password</label>
                    <div class="relative">
                        <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required placeholder="re-enter password"
                            class="w-full bg-stone-50 dark:bg-zinc-800 border border-stone-200 dark:border-zinc-700 text-zinc-900 dark:text-white text-sm px-3 py-2.5 pr-10 focus:outline-none placeholder-stone-300 dark:placeholder-zinc-600 transition-colors atss-inp">
                        <button type="button" onclick="toggleVisibility('confirm_password', this)"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-stone-400 dark:text-zinc-500 hover:text-zinc-700 dark:hover:text-zinc-300 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit"
                    class="w-full font-bold text-sm py-2.5 transition-colors mt-2" style="background:#FF9000;color:#18181b" onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">
                    Reset Password
                </button>
            </form>
        </div>

        <p class="text-xs text-stone-400 dark:text-zinc-600 mt-4 text-center">
            Remembered it?
            <a href="{{ url_for('auth.login') }}" class="text-zinc-600 dark:text-zinc-400 transition-colors" onmouseover="this.style.color='#FF9000'" onmouseout="this.style.color=''">Back to sign in</a>
        </p>
    </div>
    <script>
        function toggleVisibility(id, btn) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
            btn.style.color = btn.style.color ? '' : '#FF9000';
        }
    </script>
    <script src="{{ url_for('static', filename='cursor.js') }}"></script>
</body>
</html>
